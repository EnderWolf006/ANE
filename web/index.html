<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#156d51" />
    <title>ANE · Automated Notification-Driven Epay</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180" />
    <script>
      (function () {
        try {
          var mode = location.pathname.startsWith("/pay/")
            ? "system" : localStorage.getItem("ane-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          var root = document.documentElement;
          root.classList.add(theme);
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0d1412" : "#156d51");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
